<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create/Edit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <script src="script.js"></script>
</head>

<body class="bg-ghost-white flex flex-col h-screen m-0 text-space-black">
    <main class="flex flex-1 overflow-auto">
        <div class="w-full flex flex-col justify-center items-center space-y-4">
            <p class="italic">Click on the button below to see detail template</p>
            <button type="button" class="px-4 py-2 text-white rounded-md bg-steel-blue-500 hover:bg-steel-blue-600 focus:outline-none focus:ring-2 focus:ring-steel-blue" onclick="toggleModal('create-edit-modal')">Click me!</button>
        </div>
    </main>

    <div class="create-edit-modal absolute w-full h-full flex justify-center items-center bg-space-black/50 z-50">
        <form id="create-edit-form" class="w-full max-h-full overflow-auto max-w-6xl bg-ghost-white p-4 md:p-8 rounded-lg shadow-md space-y-8">
            <div class="flex flex-wrap-reverse items-center relative">
                <h2 class="sm:flex-1 text-2xl font-semibold sm:text-center overflow-hidden">Create/Edit [Entity]</h2>
                <div class="sm:absolute sm:right-0 flex flex-1 justify-end">
                    <button type="button" class="w-10 h-10 hover:bg-platinum-100" onclick="toggleModal('create-edit-modal')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row items-center gap-8">
                <div class="flex-1">
                    <div class="flex flex-col items-center">
                        <label for="imageUpload" class="font-medium">Image</label>
                        
                        <div class="flex justify-center relative">
                            <input type="file" id="imageUpload" accept="image/*" class="w-full h-full opacity-0 absolute cursor-pointer">
                            <img id="imagePreview" src="https://dummyimage.com/300x400/dddddd/000000&text=No+Image" alt="thumbnail" class="max-h-48 md:max-h-72 rounded-md">
                        </div>

                        <p class="text-center text-sm italic">Click on the image to upload</p>
                    </div>
                </div>

                <div class="w-full flex-[2] gap-4 grid grid-cols-1 sm:grid-cols-2">
                    <div class="flex flex-col">
                        <label for="field1" class="font-medium">Field 1*</label>
                        <input type="text" value="Value 1" name="field1" id="field1" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                        <span id="field1-error" class="error-text hidden italic text-sm text-vermilion">Field 1 is required</span>
                    </div>
                    <div class="flex flex-col">
                        <label for="field2" class="font-medium">Field 2*</label>
                        <button id="field2-button" data-dropdown-toggle="field2-dropdown" data-dropdown-placement="bottom" class="bg-white flex flex-col px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue" type="button">
                            <input hidden value="" name="field2" id="field2">
                            <div id="field2-display" class="overflow-auto min-h-6 flex flex-wrap gap-2 *:bg-platinum-200 *:px-1 *:rounded-md">
                            </div>
                        </button>

                        <div id="field2-dropdown" class="z-10 hidden bg-white rounded-lg shadow-sm w-60 border border-platinum-300">
                            <div class="p-3">
                                <label for="field2-search" class="sr-only">Search</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
                                        <i class="fa-solid fa-magnifying-glass w-4 h-4 text-platinum-500"></i>
                                    </div>
                                    <input type="text" id="field2-search" class="block w-full p-2 ps-10 text-sm border border-platinum-300 rounded-lg focus:ring-steel-blue-500 focus:border-steel-blue-500" placeholder="Search...">
                                </div>
                            </div>
                            <ul class="h-48 px-3 pb-3 overflow-y-auto text-sm text-platinum-700" aria-labelledby="field2-button">
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-1" type="checkbox" value="Option 1" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-1" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 1</label>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-2" type="checkbox" value="Option 2" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-2" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 2</label>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-3" type="checkbox" value="Option 3" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-3" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 3</label>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-4" type="checkbox" value="Option 4" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-4" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 4</label>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-5" type="checkbox" value="Option 5" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-5" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 5</label>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-6" type="checkbox" value="Option 6" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-6" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 6</label>
                                    </div>
                                </li>
                                <li>
                                    <div class="flex items-center ps-2 rounded-sm hover:bg-platinum-100">
                                        <input onchange="updateSelected(event.target, 'field2', 'field2-display')" id="checkbox-item-7" type="checkbox" value="Option 7" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2">
                                        <label for="checkbox-item-7" class="w-full py-2 ms-2 text-sm font-medium rounded-sm">Option 7</label>
                                    </div>
                                </li>
                            </ul>
                            <div class="flex items-center text-white p-3 border-t border-platinum-200 rounded-b-lg">
                                <button class="w-full py-1 text-sm font-medium bg-vermilion-500 rounded-lg hover:bg-vermilion-600">
                                    <i class="fa-regular fa-square-minus"></i>
                                    Clear all
                                </button>
                            </div>
                        </div>
                        <span id="field2-error" class="error-text hidden italic text-sm text-vermilion">Field 2 is required</span>
                    </div>
                    <div class="flex flex-col">
                        <label for="field3" class="font-medium">Field 3</label>
                        <input type="text" name="field3" id="field3" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                    </div>
                    <div class="flex flex-col">
                        <label for="field4" class="font-medium">Field 4</label>
                        <select value="" name="field4" id="field4" class="appearance-none px-4 py-2 pr-8 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                            <option value="" disabled selected hidden></option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="field5" class="font-medium">Field 5</label>
                        <input type="datetime-local" name="field5" id="field5" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                    </div>
                    <div class="flex flex-col">
                        <label for="field6" class="font-medium">Field 6</label>
                        <input type="date" name="field6" id="field6" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                    </div>
                    <div class="flex flex-col">
                        <label for="field7" class="font-medium">Field 7</label>
                        <input type="time" name="field7" id="field7" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                    </div>
                    <div class="flex flex-col">
                        <label for="field8" class="font-medium">Field 8</label>
                        <input type="time" name="field8" id="field8" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
                    </div>
                    <div class="flex flex-col sm:col-span-2">
                        <label for="field9" class="font-medium">Field 9</label>
                        <textarea name="field9" id="field9" rows="5" class="px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-center gap-4 *:w-20">
                <button type="button" onclick="onSubmit(event)" class="px-4 py-2 text-white rounded-md bg-steel-blue-500 hover:bg-steel-blue-600 focus:outline-none focus:ring-2 focus:ring-steel-blue">Save</button>
                <button type="reset" class="px-4 py-2 border border-steel-blue rounded-md hover:bg-platinum-100 text-steel-blue focus:outline-none">Reset</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>

</html>
