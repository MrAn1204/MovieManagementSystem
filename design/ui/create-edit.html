<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create/Edit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <script src="script.js"></script>
</head>

<body class="bg-ghost-white flex flex-col h-screen m-0 text-space-black">
    <main class="flex flex-1">
        <div class="w-full min-w-0 h-full flex flex-col justify-center items-center px-4">
            <form class="w-full max-w-6xl bg-white p-4 md:p-8 rounded-lg shadow-md space-y-8">
                <div class="flex flex-wrap-reverse items-center relative">
                    <h2 class="sm:flex-1 text-2xl font-semibold sm:text-center overflow-hidden">Create/Edit [Entity]</h2>
                    <div class="sm:absolute sm:right-0 flex flex-1 justify-end">
                        <button class="w-10 h-10 hover:bg-platinum/50">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row items-center gap-8">
                    <div class="flex-1">
                        <div class="flex flex-col items-center">
                            <label for="imageUpload" class="font-medium">Image</label>
                            
                            <div class="flex justify-center relative">
                                <input type="file" id="imageUpload" accept="image/*" class="w-full h-full opacity-0 absolute cursor-pointer">
                                <img id="imagePreview" src="https://dummyimage.com/300x400/dddddd/000000&text=No+Image" alt="thumbnail" class="max-h-48 md:max-h-72 rounded-md">
                            </div>

                            <p class="text-center text-sm italic">Click on the image to upload</p>
                        </div>
                    </div>

                    <div class="w-full flex-[2] gap-8 grid grid-cols-1 sm:grid-cols-2">
                        <div class="flex flex-col">
                            <label for="field1" class="font-medium">Field 1</label>
                            <input type="text" name="field1" id="field1" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field2" class="font-medium">Field 2</label>
                            <input type="text" name="field2" id="field2" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field3" class="font-medium">Field 3</label>
                            <input type="text" name="field3" id="field3" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field4" class="font-medium">Field 4</label>
                            <input type="text" name="field4" id="field4" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field5" class="font-medium">Field 5</label>
                            <input type="text" name="field5" id="field5" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field6" class="font-medium">Field 6</label>
                            <input type="text" name="field6" id="field6" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field7" class="font-medium">Field 7</label>
                            <input type="text" name="field7" id="field7" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col">
                            <label for="field8" class="font-medium">Field 8</label>
                            <input type="text" name="field8" id="field8" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        <div class="flex flex-col sm:last:col-span-2">
                            <label for="field9" class="font-medium">Field 9</label>
                            <input type="text" name="field9" id="field9" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-4">
                    <button type="submit" class="px-4 py-2 bg-munshell-blue text-white rounded-md hover:bg-cerulean focus:outline-none focus:ring-2 focus:ring-munshell-blue">Save Changes</button>
                    <button type="reset" class="px-4 py-2 border border-munshell-blue rounded-md hover:bg-platinum/50 text-munshell-blue focus:outline-none" onclick="document.getElementById('imagePreview').src='https://dummyimage.com/300x400.png/dddddd/000000'">Reset</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
