<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <script src="script.js"></script>
</head>

<body class="bg-ghost-white flex flex-col h-screen m-0 text-space-black">
    <main class="flex flex-1">
        <div class="w-full min-w-0 h-full flex flex-col justify-center items-center px-4">
            <!-- Search Bar -->
            <form action="" method="get" class="flex flex-col w-full md:w-11/12 max-h-[45%] md:max-h-[50%] py-4 space-y-4 overflow-y-auto">
                <div class="flex gap-4 flex-col md:flex-row">
                    <div class="flex grow-[3]">
                        <input type="text" name="keyword" placeholder="Search..." class="w-full px-4 py-2 border border-french-gray rounded-l-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        <button type="submit" class="px-4 py-2 bg-munshell-blue text-white rounded-r-md hover:bg-cerulean focus:outline-none focus:ring-2 focus:ring-munshell-blue">Search</button>
                    </div>

                    <div class="flex gap-4 grow">
                        <div class="flex grow">
                            <button type="button" class="order-button w-1/4 max-w-12 border bg-white border-french-gray rounded-tl-md rounded-bl-md text-munshell-blue focus:outline-none" onclick="toggleOrder()">
                                <i id="icon-asc" class="fa-solid fa-arrow-up-short-wide"></i>
                                <i id="icon-desc" class="fa-solid fa-arrow-down-short-wide hidden"></i>
                            </button>

                            <select name="order" id="order" class="grow p-2 border border-l-0 rounded-tr-md rounded-br-md border-french-gray focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                                <option value="" disabled selected hidden>Order by</option>
                                <option value="option1">Option 1</option>
                                <option value="option2">Option 2</option>
                                <option value="option3">Option 3</option>
                            </select>
                        </div>
    
                        <button type="button" class="filter-button grow max-w-12 border border-munshell-blue rounded-md text-munshell-blue focus:outline-none" onclick="toggleFilter()">
                            <i class="fa-solid fa-filter"></i>
                        </button>
                    </div>
                </div>

                <hr class="border-french-gray">
                <div class="filter space-y-4 overflow-y-auto transition-all duration-500 ease-in-out max-h-0 opacity-0">
                    <div class="flex gap-4 *:flex-1 flex-wrap">
                        <select name="firstField" id="firstField" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                            <option value="" selected>Any [Field] 1</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>

                        <select name="secondField" id="secondField" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                            <option value="" selected>Any [Field] 2</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>

                        <select name="thirdField" id="thirdField" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                            <option value="" selected>Any [Field] 3</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>

                        <select name="fourthField" id="fourthField" class="px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                            <option value="" selected>Any [Field] 4</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>
                    </div>

                    <!-- Date time selector -->
                    <div>
                        <label for="dateTime" class="block font-medium text-gray-700">On:</label>
                        <input type="datetime-local" name="dateTime" id="dateTime" class="w-full px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                    </div>
                    
                    <!-- Date range selector -->
                    <div class="flex *:flex-1 flex-wrap gap-4 items-center">
                        <div>
                            <label for="startDate" class="block font-medium text-gray-700">From:</label>
                            <input type="date" name="startDate" id="startDate" class="w-full px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>

                        <div>
                            <label for="endDate" class="block font-medium text-gray-700">To:</label>
                            <input type="date" name="endDate" id="endDate" class="w-full px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                    </div>

                    <!-- Date & time range selector -->
                    <div class="flex flex-wrap gap-4 items-center">
                        <div class="grow">
                            <label for="date" class="block font-medium text-gray-700">On:</label>
                            <input type="date" name="date" id="date" class="w-full px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                        </div>
                        
                        <div class="grow-[2] flex *:flex-1 gap-4 flex-wrap">
                            <div>
                                <label for="startTime" class="block font-medium text-gray-700">From:</label>
                                <input type="time" name="startTime" id="startTime" class="w-full px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                            </div>
    
                            <div>
                                <label for="endTime" class="block font-medium text-gray-700">To:</label>
                                <input type="time" name="endTime" id="endTime" class="w-full px-4 py-2 border border-french-gray rounded-md focus:outline-none focus:ring-2 focus:ring-munshell-blue">
                            </div>
                        </div>
                    </div>
                </div>
                <hr id="filter-bottom" class="hidden border-french-gray">
            </form>
        </div>
    </main>
</body>

</html>
