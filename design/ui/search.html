<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        platinum: '#DCDCDD',
                        frenchGray: '#C5C3C6',
                        panyeGray: '#4C5C68',
                        spaceBlack: '#46494C',
                        munshellBlue: '#1985A1',
                        blackEerie: '#1C1C1C',
                        alabaster: '#ECEBE4',
                        antiFlashWhite: '#EEF0F2',
                        ghostWhite: '#FAFAFF'
                    },
                },
            },
        }
    </script>
    <script src="script.js"></script>
</head>

<body class="bg-ghostWhite flex flex-col h-screen m-0">
    <main class="flex flex-1">
        <div class="w-full h-full flex flex-col space-y-8 justify-center items-center px-4">
            <!-- Search Bar -->
            <form action="" method="get" class="w-full py-4 space-y-4">
                <div class="flex gap-4 flex-col md:flex-row">
                    <div class="flex w-full md:w-2/3">
                        <input type="text" name="keyword" placeholder="Search..." class="w-full px-4 py-2 border border-frenchGray rounded-l-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        <button type="submit" class="px-4 py-2 bg-munshellBlue text-white rounded-r-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-munshellBlue">Search</button>
                    </div>

                    <select name="order" id="order" class="w-full md:w-2/12 px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        <option value="" disabled selected hidden>Order by</option>
                        <option value="option1">Option 1</option>
                        <option value="option2">Option 2</option>
                        <option value="option3">Option 3</option>
                    </select>

                    <button type="button" class="filter-button w-full md:w-2/12 px-4 py-2 border border-munshellBlue rounded-md text-munshellBlue focus:outline-none" onclick="toggleFilter()">
                        <i class="fa-solid fa-filter"></i>
                        <span>Filters</span>
                    </button>
                </div>

                <div class="filter hidden">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <select name="firstField" id="firstField" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                            <option value="" selected>Any [Field] 1</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>

                        <select name="secondField" id="secondField" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                            <option value="" selected>Any [Field] 2</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>

                        <select name="thirdField" id="thirdField" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                            <option value="" selected>Any [Field] 3</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>

                        <select name="fourthField" id="fourthField" class="md:col-span-3 w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                            <option value="" selected>Any [Field] 4</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>
                    </div>

                    <!-- Date time selector -->
                    <div>
                        <label for="dateTime" class="block font-medium text-gray-700">On:</label>
                        <input type="datetime-local" name="dateTime" id="dateTime" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                    </div>
                    
                    <!-- Date range selector -->
                    <div class="flex flex-col md:flex-row gap-4 items-center">
                        <div class="w-full">
                            <label for="startDate" class="block font-medium text-gray-700">From:</label>
                            <input type="date" name="startDate" id="startDate" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        </div>

                        <div class="w-full">
                            <label for="endDate" class="block font-medium text-gray-700">To:</label>
                            <input type="date" name="endDate" id="endDate" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        </div>
                    </div>

                    <!-- Date & time range selector -->
                    <div class="flex flex-col md:flex-row gap-4 items-center">
                        <div class="w-full">
                            <label for="date" class="block font-medium text-gray-700">On:</label>
                            <input type="date" name="date" id="date" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        </div>
                        <div class="w-full">
                            <label for="startTime" class="block font-medium text-gray-700">From:</label>
                            <input type="time" name="startTime" id="startTime" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        </div>

                        <div class="w-full">
                            <label for="endTime" class="block font-medium text-gray-700">To:</label>
                            <input type="time" name="endTime" id="endTime" class="w-full px-4 py-2 border border-frenchGray rounded-md focus:outline-none focus:ring-2 focus:ring-munshellBlue">
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
