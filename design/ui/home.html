<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <script src="script.js"></script>
</head>

<body class="bg-ghost-white flex flex-col h-screen m-0 text-space-black">
    <header class="bg-anti-flash-white w-full border-french-gray border-b py-1 lg:hidden">
        <div class="relative">
            <button id="expand" class="absolute top-1/2 left-2 -translate-y-1/2 hover:bg-platinum/50 w-10 h-10"
                onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
    
            <div class="flex justify-center">
                <img src="../MMS_transparent.png" alt="Logo" class="w-16" />
            </div>

        </div>
    </header>

    <main class="flex flex-1">
        <div id="overlay" class="hidden fixed w-full h-full bg-space-black/50 z-30 lg:hidden">
            <button class="w-full h-full cursor-default" onclick="toggleSidebar()"></button>
        </div>

        <!-- Sidebar -->
        <aside class="flex bg-anti-flash-white transition-all duration-500 ease-in-out -left-64 lg:left-0 absolute z-40 lg:relative lg:flex lg:h-full h-[calc(100vh-51.66px)] w-64 lg:min-w-64 flex-col border-r border-french-gray py-4 items-center">
            <div>
                <img src="../MMS_transparent.png" alt="Logo" class="hidden lg:block w-32" />
            </div>
            
            <nav class="flex-1 w-full">
                <ul class="p-4 space-y-4 text-2xl">
                    <li class="rounded-md px-4 py-1 overflow-hidden bg-platinum hover:cursor-pointer">
                        <a href="#home" class="space-x-4">
                            <i class="fa-solid fa-house"></i>
                            <span>Home</span>
                        </a>
                    </li>
                    <li class="rounded-md px-4 py-1 overflow-hidden hover:bg-platinum/50 hover:cursor-pointer">
                        <a href="#movie" class="space-x-4">
                            <i class="fa-solid fa-film"></i>
                            <span>Movie</span>
                        </a>
                    </li>
                    <li class="rounded-md px-4 py-1 overflow-hidden hover:bg-platinum/50 hover:cursor-pointer">
                        <a href="#schedule" class="space-x-4">
                            <i class="fa-solid fa-calendar"></i>
                            <span>Schedule</span>
                        </a>
                    </li>
                    <li class="rounded-md px-4 py-1 overflow-hidden hover:bg-platinum/50 hover:cursor-pointer">
                        <a href="#room" class="space-x-4">
                            <i class="fa-solid fa-door-closed"></i>
                            <span>Room</span>
                        </a>
                    </li>
                    <li class="rounded-md px-4 py-1 overflow-hidden hover:bg-platinum/50 hover:cursor-pointer">
                        <a href="#promotion" class="space-x-4">
                            <i class="fa-solid fa-percent"></i>
                            <span>Promotion</span>
                        </a>
                    </li>
                    <li class="rounded-md px-4 py-1 overflow-hidden hover:bg-platinum/50 hover:cursor-pointer">
                        <a href="#user" class="space-x-4">
                            <i class="fa-solid fa-users"></i>
                            <span>User</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="flex flex-col w-full justify-evenly overflow-hidden px-2">
                <hr class="border-french-gray">
                <div class="w-full flex items-center p-2">
                    <img src="../user-solid-full.svg" alt="user_pfp" class="w-1/6 rounded-full" />
                    <div class="px-2">
                        <p class="font-bold">John Doe</p>
                        <p class="text-sm">john.doe@example.com</p>
                    </div>
                </div>
                <button class="px-2 text-white rounded-md bg-vermilion hover:bg-chili-red">
                    <i class="fa-solid fa-right-from-bracket"></i> Log Out
                </button>
            </div>
        </aside>

        <div class="w-full min-w-0 h-full flex flex-col px-4">
            <h1 class="text-3xl text-center font-bold py-8">
                Welcome to Movie Management System!
            </h1>

            <p>Coming soon!</p>
        </div>

    </main>
</body>

</html>
