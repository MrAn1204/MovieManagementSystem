<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <script src="script.js"></script>
</head>

<body class="bg-ghost-white flex flex-col h-screen m-0 text-space-black">
    <main class="flex flex-1 overflow-auto">
        <div class="w-full flex flex-col justify-center items-center space-y-4">
            <p class="italic">Click on the button below to see detail template</p>
            <button type="button" class="px-4 py-2 text-white rounded-md bg-steel-blue-500 hover:bg-steel-blue-600 focus:outline-none focus:ring-2 focus:ring-steel-blue" onclick="toggleModal('detail-modal')">Click me!</button>
        </div>
    </main>

    <div class="detail-modal absolute w-full h-full flex justify-center items-center bg-space-black/50 z-50">
        <div class="w-full max-h-full overflow-auto max-w-6xl bg-ghost-white p-4 md:p-8 rounded-lg shadow-md space-y-8">
            <div class="flex flex-wrap-reverse items-center relative">
                <h2 class="sm:flex-1 text-2xl font-semibold sm:text-center overflow-hidden">[Entity] Details</h2>
                <div class="sm:absolute sm:right-0 flex flex-1 justify-end">
                    <button class="w-10 h-10 hover:bg-platinum/50" onclick="toggleModal('detail-modal')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-col md:flex-row items-center gap-8">
                <div class="flex flex-1 justify-center">
                    <img src="https://dummyimage.com/300x400/dddddd/000000&text=No+Image" alt="thumbnail" class="max-h-48 md:max-h-72 rounded-md">
                </div>

                <div class="w-full flex-[2] gap-8 grid grid-cols-1 sm:grid-cols-2">
                    <div class="flex flex-col">
                        <span class="font-medium">Field 1</span>
                        <span>Value 1</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 2</span>
                        <span>Value 2</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 3</span>
                        <span>Value 3</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 4</span>
                        <span>Value 4</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 5</span>
                        <span>Value 5</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 6</span>
                        <span>Value 6</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 7</span>
                        <span>Value 7</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-medium">Field 8</span>
                        <span>Value 8</span>
                    </div>
                    <div class="flex flex-col sm:last:col-span-2">
                        <span class="font-medium">Field 9</span>
                        <span>Value 9</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
