                <!-- Pagination -->
                <div class="flex md:flex-row flex-col justify-between items-center gap-4 py-4">
                    <div class="w-full flex md:flex-col flex-row justify-between *:flex-1 gap-4 md:gap-0">
                        <p>1 - 10 of 50 entries</p>
                        <div class="h-fit flex flex-wrap items-center justify-end md:justify-start">
                            <label for="pages" class="mr-2">Page size:</label>
                            <select id="entries" name="entries" class="border border-french-gray rounded-md ">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>

                        <button class="rounded-md border border-french-gray p-2 text-center text-sm transition-all shadow-sm hover:shadow-lg hover:text-white hover:bg-space-black hover:border-space-black focus:text-white focus:bg-space-black focus:border-space-black active:border-space-black active:text-white active:bg-space-black disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none">

                        </button>
                        <div class="flex items-center justify-center gap-2">

                                3
                            </button>
                            <button class="md:hi w-10 rounded-md border border-french-gray p-2 text-center text-sm transition-all shadow-sm hover:shadow-lg hover:text-white hover:bg-space-black hover:border-space-black focus:text-white focus:bg-space-black focus:border-space-black active:border-space-black active:text-white active:bg-space-black disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none">
                                4
                            </button>
                            <span class="w-10 rounded-md border border-french-gray p-2 text-center text-sm shadow-sm">
                                ...
                            </span>
                            <button class="w-10 rounded-md border border-french-gray p-2 text-center text-sm transition-all shadow-sm hover:shadow-lg hover:text-white hover:bg-space-black hover:border-space-black focus:text-white focus:bg-space-black focus:border-space-black active:border-space-black active:text-white active:bg-space-black disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none">
