<app-header (toggleSidebar)="toggleSidebar()"></app-header>

<main class="flex flex-1 overflow-auto lg:h-screen h-[calc(100vh-48px)]">
  <div id="overlay" [hidden]="!sidebarVisible" class="fixed w-full h-full bg-space-black/50 z-30 lg:hidden">
    <button class="w-full h-full cursor-default" (click)="toggleSidebar()"></button>
  </div>

  <app-sidebar [visible]="sidebarVisible"></app-sidebar>
  
  <div class="w-full flex flex-col items-center justify-center m-2 overflow-auto">
    <div class="w-full min-w-0 flex flex-col px-4">
      <h1 class="text-3xl text-center font-bold py-8">
        Welcome to Movie Management System!
      </h1>
    
      <p>Coming soon!</p>
    </div>
    
    <app-table id="table-container"></app-table>
  </div>
</main>

<router-outlet />
