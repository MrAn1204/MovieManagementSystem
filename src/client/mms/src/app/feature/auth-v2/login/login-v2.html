<div class="flex flex-col justify-center items-center h-screen bg-space-black/50">
  <form [formGroup]="form"
    class="dialog-container max-w-xs">
    <h1 class="font-bold text-2xl mb-4">User Login</h1>

    <div class="flex flex-col gap-y-2 items-center w-full *:w-full">
      <app-form-input
        [control]="form.controls.username" type="text" idName="username" label="Username">
      </app-form-input>

      <app-form-input
        [control]="form.controls.password" type="password" idName="password" label="Password">
      </app-form-input>
    </div>

    <div class="mt-4 w-full flex flex-col gap-y-4">
      <a routerLink="/v2/forgot-password" class="text-sm text-steel-blue-500 hover:underline hover:cursor-pointer italic w-fit self-end">
        Forgot Password?
      </a>

      <div class="flex flex-col">
        <app-button-v2 (clicked)="onSubmit()" variant="primary">Login</app-button-v2>
        @if (form.errors?.['serverError']) {
          <mat-error>{{ form.errors!['serverError'] }}</mat-error>
        }
      </div>

      <hr class="border-platinum-300">

      <app-button-v2 (clicked)="navigateToRegister()" variant="secondary">
        Create Account
      </app-button-v2>
    </div>
  </form>
</div>
