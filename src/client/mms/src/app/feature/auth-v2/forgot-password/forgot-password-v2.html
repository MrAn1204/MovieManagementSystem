<div class="flex flex-col justify-center items-center h-screen bg-space-black/50">
  <form [formGroup]="form" (submit)="onSubmit()"
    class="w-full max-w-2xl flex flex-col items-center bg-ghost-white p-8 rounded-lg shadow-md gap-4">
    <h1 class="font-bold text-2xl">Forgot Password</h1>

    <p class="italic text-sm">Enter your email address below and we'll send you a link to reset your password.</p>

    <app-form-input class="w-full"
      [control]="emailControl" type="text" idName="email" label="Email">
    </app-form-input>

    <div class="mt-4 w-full flex flex-col gap-y-4">
      <div class="flex flex-col">
        <button mat-raised-button color="primary" type="submit">Get Reset Link</button>
        @if (form.errors?.['serverError']) {
          <mat-error>{{ form.errors!['serverError'] }}</mat-error>
        }
      </div>

      <hr class="border-platinum-300">

      <button mat-stroked-button type="button" (click)="navigateToLogin()">
        Back to Login
      </button>
    </div>
  </form>
</div>
