<app-detail-container
  [title]="data.title"
  [audit]="audit"
  [canEdit]="hasEdit"
  [canDelete]="hasDelete"
  (editItem)="openUpdate()"
  (deleteItem)="openDelete()"
  (closeDialog)="onClose()"
>
  <div dialog-content class="detail-grid">
    <app-detail-text label="Total Money">
      {{ model?.totalMoney | formatCell }}
    </app-detail-text>

    <app-detail-text label="Discount">
      {{ model?.discount | formatCell }}
    </app-detail-text>

    <app-detail-text label="Score Added">
      {{ model?.addScore | formatCell }}
    </app-detail-text>

    <app-detail-text label="Score Used">
      {{ model?.useScore | formatCell }}
    </app-detail-text>

    <div class="sm:col-span-2">
      <app-detail-text label="Tickets"></app-detail-text>
      <app-table-v2
        [columns]="ticketColumns"
        [data]="model?.tickets ?? []"
        [rowMenuItems]="ticketRowMenuItems"
        (menuAction)="handleTicketAction($event)">
      </app-table-v2>
    </div>
  </div>
</app-detail-container>
