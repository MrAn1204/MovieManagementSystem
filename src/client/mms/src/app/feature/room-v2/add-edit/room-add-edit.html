<app-add-edit-container [title]="title" (submitForm)="onSubmit()" (resetForm)="onReset()" (closeDialog)="onClose()">
  <div dialog-content class="form-grid">
    <app-form-input class="sm:col-span-2" idName="name"
      type="text" label="Name"
      [control]="form.controls.name"
      [required]="true">
    </app-form-input>

    <app-form-input idName="rowLength"
      type="number" label="Row Length"
      [control]="form.controls.rowLength"
      [required]="true">
    </app-form-input>

    <app-form-input idName="columnLength"
      type="number" label="Column Length"
      [control]="form.controls.columnLength"
      [required]="true">
    </app-form-input>
  </div>

  @if (form.getError('serverError')) {
    <mat-error dialog-content>
      {{ form.getError('serverError') }}
    </mat-error>
  }
</app-add-edit-container>
