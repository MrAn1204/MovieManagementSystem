<app-detail-container [title]="data.title" [audit]="audit"  (editItem)="openUpdate()" (deleteItem)="openDelete()" (closeDialog)="onClose()">
  <div dialog-content class="detail-grid">
    <app-detail-text label="Name" class="sm:col-span-2">
      {{ model?.name | formatCell }}
    </app-detail-text>

    <app-detail-text label="Row Length">
      {{ model?.rowLength | formatCell }}
    </app-detail-text>

    <app-detail-text label="Column Length">
      {{ model?.columnLength | formatCell }}
    </app-detail-text>

    <app-detail-text label="Maximum Capacity">
      {{ model?.maxCapacity | formatCell }}
    </app-detail-text>

    <app-detail-text label="Current Capacity">
      {{ model?.currentCapacity | formatCell }}
    </app-detail-text>

  </div>

  <div dialog-content>
    <mat-divider class="my-4!"></mat-divider>

    <app-seat-map-v2 #seatMap
      [showType]="true"
      [rowLength]="model?.rowLength ?? 0"
      [columnLength]="model?.columnLength ?? 0"
      [roomId]="model?.id ?? ''"
      [seats]="model?.seats ?? []"
      (viewSeat)="$event ? hideSelf() : onRefresh()"
    ></app-seat-map-v2>
  </div>

  @if (canAddSeat()) {
    <app-button-v2 dialog-action variant="success" (clicked)="openAddSeat()">
      Add Seat
    </app-button-v2>
  }
</app-detail-container>
