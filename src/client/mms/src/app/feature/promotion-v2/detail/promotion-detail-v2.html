<app-detail-container [title]="data.title" [audit]="audit" (editItem)="openUpdate()" (deleteItem)="openDelete()" (closeDialog)="onClose()">
  <div dialog-content class="detail-layout">
    <app-detail-image [src]="model?.image"></app-detail-image>

    <div class="detail-grid">
      <app-detail-text label="Title">
        {{ model?.title | formatCell }}
      </app-detail-text>

      <app-detail-text label="Discount">
        {{ model?.discount | formatCell: 'percentage' }}
      </app-detail-text>

      <app-detail-text label="Start Date">
        {{ model?.startDate | formatCell: 'date' }}
      </app-detail-text>

      <app-detail-text label="End Date">
        {{ model?.endDate | formatCell: 'date' }}
      </app-detail-text>

      <app-detail-text class="sm:col-span-2" label="Description">
        {{ model?.description | formatCell }}
      </app-detail-text>
    </div>
  </div>
</app-detail-container>
