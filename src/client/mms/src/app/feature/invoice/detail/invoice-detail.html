<app-detail [title]="data.title" [roleConfig]="data.roleConfig" [auditInfo]="auditInfo" (openUpdate)="openUpdate()" (openDelete)="openDelete()" (closeDialog)="close()">
  <div class="w-full flex-1 gap-8 grid grid-cols-1 sm:grid-cols-2">
    <app-detail-text label="Total Money">
      {{ model?.totalMoney | formatCell }}
    </app-detail-text>

    <app-detail-text label="Discount">
      {{ model?.discount | formatCell }}
    </app-detail-text>

    <app-detail-text label="Score Added">
      {{ model?.addScore | formatCell }}
    </app-detail-text>

    <app-detail-text label="Score Used">
      {{ model?.useScore | formatCell }}
    </app-detail-text>

    <div class="sm:col-span-2">
      <app-detail-text label="Tickets"></app-detail-text>

      <app-ticket-table [data]="model?.tickets ?? []">
      </app-ticket-table>
    </div>
  </div>
</app-detail>
