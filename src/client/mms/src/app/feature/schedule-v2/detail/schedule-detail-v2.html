<app-detail-container [title]="data.title" [audit]="audit" (editItem)="openUpdate()" (deleteItem)="openDelete()" (closeDialog)="onClose()">
  <div dialog-content class="detail-grid">
    <app-detail-text label="Name">
      {{ model?.name | formatCell }}
    </app-detail-text>

    <app-detail-text label="Show Time">
      {{ model?.showTime | formatCell: 'datetime' }}
    </app-detail-text>

    <app-detail-text label="Movie">
      {{ model?.movie | formatCell: 'id-name' }}
    </app-detail-text>

    <app-detail-text label="Room">
      {{ model?.room | formatCell: 'id-name' }}
    </app-detail-text>

  </div>

  <div dialog-content>
    <mat-divider class="my-4!"></mat-divider>

    <app-seat-map-v2
      [rowLength]="model?.rowLength ?? 0"
      [columnLength]="model?.columnLength ?? 0"
      [roomId]="model?.room?.id ?? ''"
      [seats]="model?.seats ?? []"
      (viewSeat)="$event ? hideSelf() : onRefresh()"
    ></app-seat-map-v2>
  </div>
</app-detail-container>
