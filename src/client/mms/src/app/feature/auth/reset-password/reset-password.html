<div class="flex flex-col justify-center items-center h-screen bg-space-black/50">
  <form [formGroup]="form" (submit)="onSubmit()"
    class="flex flex-col items-center bg-ghost-white p-8 rounded-lg shadow-md gap-4">
    <h1 class="font-bold text-2xl">Reset Password</h1>

    <p class="italic text-sm">Enter your new password below.</p>

    <div class="w-full">
      <app-input-field
        formControlName="password" inputType="password" idName="password" placeholderText="New Password">
      </app-input-field>

      <app-validation-error [control]="form.get('password')!"></app-validation-error>
    </div>

    <div class="w-full">
      <app-input-field
        formControlName="confirmPassword" inputType="password" idName="confirmPassword" placeholderText="Confirm New Password">
      </app-input-field>

      <app-validation-error [control]="form.get('confirmPassword')!"></app-validation-error>
    </div>

    <div class="mt-4 w-full flex flex-col gap-y-4">
      <div class="flex flex-col">
        <app-button class="w-full!" type="submit">
          Reset Password
        </app-button>

        <app-validation-error [control]="form"></app-validation-error>
      </div>

      <hr class="border-platinum-300">

      <app-button class="w-full!" variant="secondary" (clicked)="navigateToLogin()">
        Back to Login
      </app-button>
    </div>
  </form>
</div>
