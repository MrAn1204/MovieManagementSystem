<div class="flex flex-col justify-center items-center h-screen bg-space-black/50">
  <form [formGroup]="form" (submit)="onSubmit()"
    class="flex flex-col items-center bg-ghost-white p-8 rounded-lg shadow-md">
    <h1 class="font-bold text-2xl mb-8">User Login</h1>

    <div class="flex flex-col gap-y-4 items-center">
      <div>
        <app-input-field
          formControlName="username" inputType="text" idName="username" placeholderText="Username">
        </app-input-field>

        <app-validation-error [control]="form.get('username')!"></app-validation-error>
      </div>

      <div>
        <app-input-field
          formControlName="password" inputType="password" idName="password" placeholderText="Password">
        </app-input-field>

        <app-validation-error [control]="form.get('password')!"></app-validation-error>
      </div>

      @if (form.hasError('loginFailed')) {
        <p class="error-text">{{ form.getError('loginFailed') }}</p>
      }
    </div>


    <div class="mt-4 w-full flex flex-col gap-y-4">
      <button type="submit"
        class="px-4 py-2 text-white rounded-md bg-steel-blue-500 hover:bg-steel-blue-600 focus:outline-none focus:ring-2 focus:ring-steel-blue">
        Login
      </button>

      <hr class="border-platinum-300">

      <button type="button" (click)="navigateToRegister()"
        class="px-4 py-2 border border-steel-blue rounded-md hover:bg-platinum-100 text-steel-blue focus:outline-none">
        Create Account
      </button>
    </div>
  </form>
</div>
