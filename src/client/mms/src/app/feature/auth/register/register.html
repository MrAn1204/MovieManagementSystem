<div class="flex flex-col justify-center items-center h-screen bg-space-black/50">
  <form [formGroup]="form" (submit)="onSubmit()"
    class="w-screen max-h-screen overflow-auto max-w-2xl flex flex-col items-center bg-ghost-white p-8 rounded-lg shadow-md">
    
    <h1 class="font-bold text-2xl mb-8">Create Account</h1>

    <div class="w-full gap-4 grid grid-cols-1 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <app-input-field 
          formControlName="username" inputType="text" idName="username" labelText="Username">
        </app-input-field>
        
        <app-validation-error 
          [control]="form.get('username')!" [errorMessages]="errorMessages.username">
        </app-validation-error>
      </div>
      
      <div class="sm:col-span-2">
        <app-input-field 
          formControlName="password" inputType="password" idName="password" labelText="Password">
        </app-input-field>
        
        <app-validation-error 
          [control]="form.get('password')!" [errorMessages]="errorMessages.password">
        </app-validation-error>
      </div>

      <div class="sm:col-span-2">
        <app-input-field 
          formControlName="confirmPassword" inputType="password" idName="confirmPassword" labelText="Confirm Password">
        </app-input-field>

        <app-validation-error 
          [control]="form.get('confirmPassword')!" [errorMessages]="errorMessages.confirmPassword">
        </app-validation-error>
      </div>

      <hr class="border-platinum-300 sm:col-span-2">

      <div>
        <app-input-field 
          formControlName="fullname" inputType="text" idName="fullname" labelText="Full Name">
        </app-input-field>
        
        <app-validation-error 
          [control]="form.get('fullname')!" [errorMessages]="errorMessages.fullname">
        </app-validation-error>
      </div>

      <div>
        <app-select-field 
          formControlName="gender" idName="gender" labelText="Gender" [options]="genders">
        </app-select-field>
      </div>

      <div>
        <app-input-field 
          formControlName="dateOfBirth" inputType="date" idName="dateOfBirth" labelText="Date of Birth">
        </app-input-field>

        <app-validation-error 
          [control]="form.get('dateOfBirth')!" [errorMessages]="errorMessages.dateOfBirth">
        </app-validation-error>
      </div>

      <div>
        <app-input-field 
          formControlName="phoneNumber" inputType="tel" idName="phoneNumber" labelText="Phone Number">
        </app-input-field>

        <app-validation-error 
          [control]="form.get('phoneNumber')!" [errorMessages]="errorMessages.phoneNumber">
        </app-validation-error>
      </div>

      <div class="sm:col-span-2">
        <app-input-field 
          formControlName="email" inputType="email" idName="email" labelText="Email">
        </app-input-field>

        <app-validation-error 
          [control]="form.get('email')!" [errorMessages]="errorMessages.email">
        </app-validation-error>
      </div>
    </div>


    <div class="mt-4 w-full flex flex-col gap-y-4">
      <button type="submit"
        class="px-4 py-2 text-white rounded-md bg-steel-blue-500 hover:bg-steel-blue-600 focus:outline-none focus:ring-2 focus:ring-steel-blue">
        Register
      </button>

      <hr class="border-platinum-300">

      <button type="button" (click)="navigateToLogin()"
        class="px-4 py-2 border border-steel-blue rounded-md hover:bg-platinum-100 text-steel-blue focus:outline-none">
        Go to Login
      </button>
    </div>
  </form>
</div>
