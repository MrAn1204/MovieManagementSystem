<div class="filter-layout">
  <div class="filter-common">
    <app-select-field idName="filter-language" labelText="Language"></app-select-field>
  </div>

  <div class="filter-multiselect">
    <app-multiselect-field idName="filter-genre" labelText="Genre"></app-multiselect-field>

    <app-multiselect-field idName="filter-studio" labelText="Studio"></app-multiselect-field>
  </div>

  <div class="filter-range">
    <app-input-field inputType="date" idName="release-after" labelText="Release After"></app-input-field>

    <app-input-field inputType="date" idName="release-before" labelText="Release Before"></app-input-field>
  </div>
</div>
