<div class="filter-layout">
  <div class="filter-common">
    <app-select-field formControlName="languageId" idName="filter-language" labelText="Language" [options]="languages()"></app-select-field>
  </div>

  <div class="filter-multiselect">
    <app-multiselect-field formControlName="genreIds" idName="filter-genre" labelText="Genre" [options]="genres()"></app-multiselect-field>
    
    <app-multiselect-field formControlName="studioIds" idName="filter-studio" labelText="Studio" [options]="studios()"></app-multiselect-field>
  </div>

  <div class="filter-range">
    <app-input-field inputType="date" formControlName="releaseAfter" idName="release-after" labelText="Release After"></app-input-field>
    
    <app-input-field inputType="date" formControlName="releaseBefore" idName="release-before" labelText="Release Before"></app-input-field>
  </div>
</div>
