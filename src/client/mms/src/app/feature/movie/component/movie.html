<div class="w-full h-full flex flex-col items-center">
  <app-search [form]="searchForm" [contentFilter]="contentFilter" [sortOptions]="sortOptions" 
    (triggerSearch)="onSearch()">
  </app-search>

  <app-table entityName="Movie" [columns]="columns" [data]="data()" 
    [contentCreateEdit]="contentCreateEdit" [contentDetail]="contentDetail" 
    (changePageNumber)="onChangePageNumber($event)" (changePageSize)="onChangePageSize($event)">
  </app-table>
</div>
