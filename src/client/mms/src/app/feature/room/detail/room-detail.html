<app-detail [title]="data.title" [roleConfig]="data.roleConfig" (openUpdate)="openUpdate()" (openDelete)="openDelete()" (closeDialog)="close()">
  <div class="w-full flex-1 gap-8 grid grid-cols-1 sm:grid-cols-2">
    <app-detail-text label="Name" class="sm:col-span-2">
      {{ model.name | formatCell }}
    </app-detail-text>

    <app-detail-text label="Row Length">
      {{ model.rowLength | formatCell }}
    </app-detail-text>

    <app-detail-text label="Column Length">
      {{ model.columnLength | formatCell }}
    </app-detail-text>

    <app-detail-text label="Maximum Capacity">
      {{ (model.rowLength * model.columnLength) | formatCell }}
    </app-detail-text>

    <app-detail-text label="Current Capacity">
      {{ model.seats.length | formatCell }}
    </app-detail-text>

  </div>

  <hr class="my-8 border-platinum-300">

  <app-seat-map [rowLength]="model.rowLength" [columnLength]="model.columnLength" [roomId]="model.id"></app-seat-map>
</app-detail>
