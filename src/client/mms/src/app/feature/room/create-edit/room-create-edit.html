<app-create-edit [formGroup]="form" [title]="data.title" (submitForm)="onSubmit()" (resetForm)="onReset()" (closeDialog)="close()">
  <div class="create-edit-layout">
    <div class="w-full flex-1 gap-4 grid grid-cols-1 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <app-input-field formControlName="name"
          inputType="text" idName="name" labelText="Name">
        </app-input-field>

        <app-validation-error [control]="form.get('name')!"></app-validation-error>
      </div>

      <div>
        <app-input-field formControlName="rowLength"
          inputType="number" idName="rowLength" labelText="Row Length">
        </app-input-field>

        <app-validation-error [control]="form.get('rowLength')!"></app-validation-error>
      </div>

      <div>
        <app-input-field formControlName="columnLength"
          inputType="number" idName="columnLength" labelText="Column Length">
        </app-input-field>

        <app-validation-error [control]="form.get('columnLength')!"></app-validation-error>
      </div>
    </div>
  </div>
</app-create-edit>
