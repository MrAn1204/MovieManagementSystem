<app-create-edit [formGroup]="form" [title]="data.title" (submitForm)="onSubmit()" (resetForm)="onReset()" (closeDialog)="close()">
  <div class="create-edit-layout">
    <div class="w-full flex-1 gap-4 grid grid-cols-1 sm:grid-cols-2">
      <div>
        <app-input-field formControlName="showTime"
          inputType="datetime-local" idName="showTime" labelText="Show Time">
        </app-input-field>
      </div>

      <div>
        <app-select-field formControlName="movieId"
          idName="movie" labelText="Movie" [options]="movies()">
        </app-select-field>

        <app-validation-error [control]="form.get('movieId')!"></app-validation-error>
      </div>

      <div>
        <app-select-field formControlName="roomId"
          idName="room" labelText="Room" [options]="rooms()">
        </app-select-field>

        <app-validation-error [control]="form.get('roomId')!"></app-validation-error>
      </div>
    </div>
  </div>
</app-create-edit>
