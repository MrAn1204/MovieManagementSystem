<h1 class="text-3xl text-center font-bold py-8">
  Welcome to Movie Management System!
</h1>

<div>
  <div class="flex flex-nowrap gap-2 md:gap-4 py-2 md:py-4 overflow-x-auto w-full
    *:flex *:border *:md:p-4 *:p-2 *:min-w-48 *:flex-1 *:overflow-hidden *:justify-center *:items-center
    *:bg-white *:rounded-xl *:shadow-md *:hover:bg-blue-50
    *:transition *:duration-300 *:ease-in-out *:h-full">

    <a routerLink="/movie" class="text-steel-blue hover:text-steel-blue-600">
      <i class="fa-film fa-solid text-3xl md:text-5xl"></i>
      <div class="flex md:flex-col px-2 md:px-4 not-md:space-x-2">
        <p class="font-bold text-3xl">{{ movies().length }}</p>
        <p class="font-semibold text-gray-600 not-md:self-center">Movies</p>
      </div>
    </a>

    <a routerLink="/ticket" class="text-bright-fern hover:text-bright-fern-600">
      <i class="fa-ticket fa-solid text-3xl md:text-5xl"></i>
      <div class="flex md:flex-col px-2 md:px-4 not-md:space-x-2">
        <p class="font-bold text-3xl">{{ tickets().length }}</p>
        <p class="font-semibold text-gray-600 not-md:self-center">Tickets</p>
      </div>
    </a>

    <a routerLink="/room" class="text-carrot-orange hover:text-carrot-orange-600">
      <i class="fa-door-closed fa-solid text-3xl md:text-5xl"></i>
      <div class="flex md:flex-col px-2 md:px-4 not-md:space-x-2">
        <p class="font-bold text-3xl">{{ rooms().length }}</p>
        <p class="font-semibold text-gray-600 not-md:self-center">Rooms</p>
      </div>
    </a>

    <a routerLink="/schedule" class="text-vermilion hover:text-vermilion-600">
      <i class="fa-calendar fa-solid text-3xl md:text-5xl"></i>
      <div class="flex md:flex-col px-2 md:px-4 not-md:space-x-2">
        <p class="font-bold text-3xl">{{ schedules().length }}</p>
        <p class="font-semibold text-gray-600 not-md:self-center">Schedules</p>
      </div>
    </a>

    <a routerLink="/promotion" class="text-lavender-purple hover:text-lavender-purple-600">
      <i class="fa-percent fa-solid text-3xl md:text-5xl"></i>
      <div class="flex md:flex-col px-2 md:px-4 not-md:space-x-2">
        <p class="font-bold text-3xl">{{ promotions().length }}</p>
        <p class="font-semibold text-gray-600 not-md:self-center">Promotions</p>
      </div>
    </a>

    <a routerLink="/user" class="text-platinum hover:text-platinum-600">
      <i class="fa-users fa-solid text-3xl md:text-5xl"></i>
      <div class="flex md:flex-col px-2 md:px-4 not-md:space-x-2">
        <p class="font-bold text-3xl">{{ users().length }}</p>
        <p class="font-semibold text-gray-600 not-md:self-center">Users</p>
      </div>
    </a>
  </div>

  <div class="flex">
    <div class="w-1/2">
      <c-chart [data]="ticketSold()" type="bar"></c-chart>
    </div>

    <div class="flex flex-col w-1/2">
      <h2 class="text-2xl font-bold pb-4">Upcoming Movies</h2>

      <app-table class="w-full!" [columns]="movieColumns" [data]="upcomingMovies()" [tableConfig]="{ checkbox: false }">

      </app-table>
    </div>
  </div>
</div>
