@if (hasUser()) {
  <app-header-v2 (toggleSidebar)="sidenav.toggle()"></app-header-v2>

  <mat-sidenav-container class="flex-1">
    <mat-sidenav #sidenav [class.rounded-none!]="showSidebar()" class="border-platinum-300!" [mode]="sidebarMode()" [opened]="showSidebar()">
      <app-sidebar-v2></app-sidebar-v2>
    </mat-sidenav>

    <mat-sidenav-content class="p-2">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
