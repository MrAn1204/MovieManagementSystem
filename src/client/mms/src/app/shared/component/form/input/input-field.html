<div [class.relative]="inputType() === 'time'">
  @if (labelText()) {
  <label [htmlFor]="idName()" class="block font-medium">{{ labelText() }}</label>
  }
  <input [type]="inputType()" [value]="value" [id]="idName()" [placeholder]="placeholderText()" (input)="updateValue(inputType() === 'number' ? $any($event.target).valueAsNumber : $any($event.target).value)"
    class="w-full px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">

  @if (inputType() === 'time') {
  <div class="absolute top-[calc(50%+4px)] end-0 flex items-center pe-[18.5px] pointer-events-none">
    <i class="fa-regular fa-clock"></i>
  </div>
  }
</div>
