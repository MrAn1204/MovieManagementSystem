@if (labelName()) {
  <label [htmlFor]="idName()" class="block font-medium">{{ labelName() }}</label>
}
<select [id]="idName()" class="w-full px-4 py-2 border border-platinum-300 rounded-md focus:outline-none focus:ring-2 focus:ring-steel-blue">
  <option value="" selected>Any [Field]</option>
  @for (option of options; track $index) {
  <option value="{{option.value}}">{{option.label}}</option>
  }
</select>
