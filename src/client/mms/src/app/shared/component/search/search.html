<form [formGroup]="form()" (submit)="onSubmit()" class="flex flex-col max-h-screen overflow-auto">
  <div class="flex gap-4 sm:flex-row flex-col">
    <div class="flex grow-3">
      <input type="text" formControlName="keyword" placeholder="Search..."
        class="form-field rounded-r-none">
      <button type="submit"
        class="w-12 text-white rounded-r-md bg-steel-blue hover:bg-steel-blue-500 focus:outline-none focus:ring-2 focus:ring-steel-blue">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div class="flex flex-wrap gap-4 grow">
      <div class="flex grow-3">
        <button type="button"
          class="order-button w-1/4 max-w-12 border bg-white border-platinum-300 rounded-tl-md rounded-bl-md text-steel-blue focus:outline-none"
          (click)="toggleOrder()">
          @if (ascending) {
            <i id="icon-asc" class="fa-solid fa-arrow-up-short-wide"></i>
          } @else {
            <i id="icon-desc" class="fa-solid fa-arrow-down-short-wide"></i>
          }
        </button>

        <select name="order" id="order" formControlName="sortBy"
          class="form-field border-l-0 rounded-l-none p-2">
          <option value="id" selected hidden>Order by</option>
          <option value="id">Default</option>
          @for (option of sortOptions(); track $index) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div class="flex flex-1 h-10.5">
        <button type="button"
          class="filter-button min-w-12 w-1/2 border border-steel-blue rounded-tl-md rounded-bl-md hover:bg-platinum-100 text-steel-blue focus:outline-none"
          [class.bg-steel-blue-500]="filterVisible"
          [class.text-white]="filterVisible"
          [class.hover:text-white]="filterVisible"
          [class.hover:bg-steel-blue-600]="filterVisible"
          (click)="toggleFilter()">
          <i class="fa-solid fa-filter"></i>
        </button>

        <button type="button"
          class="filter-button min-w-12 w-1/2 border border-l-0 border-steel-blue rounded-tr-md rounded-br-md hover:bg-platinum-100 text-steel-blue focus:outline-none"
          (click)="reset()">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </div>
  </div>

  <hr class="mt-4 border-platinum-300">

  <div id="filter-container" [class.h-screen]="filterVisible" [class.opacity-100]="filterVisible"
    class="overflow-y-auto transition-all duration-500 ease-in-out h-0 lg:max-h-fit opacity-0">
    <ng-container [ngComponentOutlet]="contentFilter() ?? null"></ng-container>
  </div>

  <hr id="filter-bottom" [class.border-0]="!filterVisible" class="mb-4 border-platinum-300">
</form>
