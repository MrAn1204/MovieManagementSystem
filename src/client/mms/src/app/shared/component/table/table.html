@if (!data().length) {
<div class="border border-platinum-300 h-full bg-platinum-50 flex flex-col items-center justify-center">
  <p class="font-bold text-2xl">No data available</p>
</div>
} @else {
<!-- Table -->
<div class="overflow-auto border border-platinum-300">
  <table class="w-full bg-platinum-50 border-separate border-spacing-0">
    <thead class="text-left sticky top-0 z-10">
      <tr class="bg-platinum-200 *:border-b *:border-platinum-300">
        <th [hidden]="!hasCheckbox()" class="min-w-8 w-8 border-r sticky left-0 bg-platinum-200">
          <div class="flex items-center justify-center">
            <input class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2"
              type="checkbox" (change)="selectAll()" [checked]="isAllSelected()">
          </div>
        </th>

        @for (column of columns(); track $index) {
          <th class="min-w-40 px-4 py-2">{{ column.label }}</th>
        }

        <th [hidden]="!roleConfig()" class="border-l sticky right-0 bg-platinum-200 w-0">
          <app-table-actions>
            <app-button [hidden]="!canCreate()" variant="success" [rounded]="false" (clicked)="addItem()">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Add
              </div>
            </app-button>

            <ng-content select="[table-actions]"></ng-content>
          </app-table-actions>
        </th>
      </tr>
    </thead>
    <tbody class="*:border-b *:border-platinum-300">
      @for (item of data(); track $index) {
      <tr class="hover:bg-platinum-100 *:border-b *:border-platinum-300 last:*:border-b-0">
        <td [hidden]="!hasCheckbox()" class="border-r sticky left-0 bg-platinum-50">
          <div class="flex items-center justify-center">
            <input type="checkbox" class="w-4 h-4 text-steel-blue-500 bg-platinum-50 border border-platinum-300 rounded-sm focus:ring-steel-blue-500 focus:ring-2"
              (change)="select(item, $index)" [checked]="selectedItems.get($index)">
          </div>
        </td>

        @for (column of columns(); track $index) {
          <td class="px-4 py-2">{{ getColumnValue(item, column) | formatCell: column.type }}</td>
        }

        <td [hidden]="!roleConfig()" class="sticky right-0 bg-platinum-50 border-platinum-300 border-l">
          <app-row-actions
            [canView]="canView()" (viewDetail)="viewDetail(item.id)"
            [canEdit]="canEdit()" (updateItem)="updateItem(item.id)"
            [canDelete]="canDelete()" (deleteItem)="deleteItem(item.id)">
          </app-row-actions>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<!-- Pagination -->
<ng-content></ng-content>
}
