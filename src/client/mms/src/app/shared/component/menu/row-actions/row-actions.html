<div class="flex justify-center">
  <button (click)="isOpen = !isOpen" type="button" [cdkMenuTriggerFor]="menu" [cdkMenuPosition]="positions">
    <i class="fa-solid fa-ellipsis"></i>
  </button>
</div>

<ng-template #menu>
  <div cdkMenu class="flex flex-col bg-platinum-50 border border-platinum-300 rounded-md shadow-xl">
    <div class="flex flex-col items-start">
      <app-button [hidden]="!canView()" variant="icon" (clicked)="viewDetail.emit()">
        <div class="flex items-center px-2 gap-2">
          <i class="fa-solid fa-circle-info text-steel-blue"></i> View
        </div>
      </app-button>

      <app-button [hidden]="!canEdit()" variant="icon" (clicked)="updateItem.emit()">
        <div class="flex items-center px-2 gap-2">
          <i class="fa-solid fa-pen-to-square text-carrot-orange"></i> Edit
        </div>
      </app-button>
    </div>

    <div [hidden]="!canDelete()">
      <hr class="w-full border-platinum-300" />

      <app-button variant="icon" (clicked)="deleteItem.emit()">
        <div class="flex items-center px-2 gap-2">
          <i class="fa-solid fa-trash text-vermilion"></i> Delete
        </div>
      </app-button>
    </div>

  </div>
</ng-template>
