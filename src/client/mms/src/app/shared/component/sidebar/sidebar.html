<aside [class.left-0]="visible()"
  class="flex bg-platinum-50 transition-all duration-500 ease-in-out -left-64 lg:left-0 absolute z-40 lg:relative lg:h-full h-[calc(100vh-48px)] w-64 lg:min-w-64 flex-col border-r border-platinum-300 py-4 items-center">
  <div>
    <img src="/images/MMS_transparent.png" alt="Logo" class="hidden lg:block w-32" />
  </div>

  <nav class="flex-1 w-full overflow-auto">
    <ul class="p-4 space-y-4 text-2xl">
      @for (route of routes; track $index) {
        @if (canShowRoute(route.roles)) {
          <li [class]="isActive(route.path) ? 'bg-platinum-200' : 'hover:bg-platinum-100'"
            class="flex rounded-md overflow-hidden hover:cursor-pointer">
            <a class="px-4 py-1 w-full space-x-4" [routerLink]="[route.path]">
              <i class="fa-solid" [class]="route.icon"></i>
              <span>{{ route.label }}</span>
            </a>
          </li>
        }
      }
    </ul>
  </nav>

  <div class="flex flex-col w-full justify-evenly overflow-hidden px-2">
    <hr class="border-platinum-300">
    <app-button variant="simple" (clicked)="viewProfile()">
      <div class="w-full flex items-center ">
        <img src="/images/user-solid-full.svg" alt="user_pfp" class="w-1/6 rounded-full" />
        <div class="px-2">
          <p class="font-bold">{{ fullname }}</p>
          <p class="text-sm">{{ email }}</p>
        </div>
      </div>
    </app-button>
    <button type="button" (click)="onLogout()"
      class="px-2 text-white rounded-md bg-vermilion-500 hover:bg-vermilion-600">
      <i class="fa-solid fa-right-from-bracket"></i> Log Out
    </button>
  </div>
</aside>
