<div
  class="w-screen max-h-screen overflow-auto max-w-4xl bg-ghost-white p-4 md:p-8 rounded-lg shadow-md flex flex-col items-center">
  <div class="mb-8 w-full flex flex-wrap-reverse items-center relative">
    <h2 class="sm:flex-1 text-2xl font-semibold sm:text-center overflow-hidden">{{ data.title }}</h2>
    <div class="sm:absolute sm:right-0 flex flex-1 justify-end">
      <button class="w-10 h-10 hover:bg-platinum-100" (click)="close()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="w-full">
    <ng-container [ngComponentOutlet]="data.contentComponent" [ngComponentOutletInputs]="data.inputs"></ng-container>
  </div>

  <div class="mt-8 flex justify-center gap-4 *:w-20">
    <button type="button" (click)="data.updateItem()"
      class="px-4 py-2 text-white rounded-md bg-steel-blue-500 hover:bg-steel-blue-600 focus:outline-none focus:ring-2 focus:ring-steel-blue">Edit</button>
    <button type="button"
      class="px-4 py-2 text-white rounded-md bg-vermilion-500 hover:bg-vermilion-600 focus:outline-none focus:ring-2 focus:ring-vermilion">Delete</button>
  </div>
</div>
