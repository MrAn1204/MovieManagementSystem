<form [formGroup]="form()" class="flex flex-col max-h-screen overflow-y-auto overflow-x-hidden pt-2">
  <div class="flex justify-center flex-wrap gap-4">
    <mat-form-field class="grow-8" appearance="outline" subscriptSizing="dynamic">
      <input [formControl]="form().controls.keyword" aria-label="searchbar" matInput id="search-bar"
        type="search" placeholder="Search...">

      <button type="button" matSuffix mat-icon-button (click)="submit()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field class="grow" appearance="outline" subscriptSizing="dynamic">
      <mat-label>Sort By</mat-label>
      <mat-select [formControl]="form().controls.sortBy">
        @for (option of sortOptions(); track option.value) {
        <mat-option [value]="option.value">
          {{ option.label }}
        </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="flex flex-col items-center justify-center">
      <mat-button-toggle-group [formControl]="form().controls.sortDirection" hideSingleSelectionIndicator="true">
        <mat-button-toggle value="ASC" matTooltip="Sort Ascending">
          <mat-icon>arrow_upward</mat-icon>
        </mat-button-toggle>

        <mat-button-toggle value="DESC" matTooltip="Sort Descending">
          <mat-icon>arrow_downward</mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <div class="flex items-center">
      <button type="button" mat-icon-button [class.active]="filterVisible" (click)="toggleFilters()" matTooltip="Toggle Filters">
        <mat-icon>filter_list</mat-icon>
      </button>

      <button type="button" mat-icon-button (click)="reset()" matTooltip="Reset">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  </div>

  <hr class="mt-4 border-platinum-300">

  <div id="filter-container" [class.h-screen]="filterVisible" [class.opacity-100]="filterVisible"
    class="overflow-y-auto transition-all duration-500 ease-in-out h-0 max-h-fit opacity-0">
    <ng-content></ng-content>
  </div>

  <hr id="filter-bottom" [class.border-0]="!filterVisible" class="mb-4 border-platinum-300">
</form>
