<div class="w-full flex justify-center">
  <img src="/images/MMS_transparent.png" alt="Logo" class="lg:block w-32" />
</div>

<mat-nav-list>
  @for (route of routes; track $index) {
    @if (canShowRoute(route.roles)) {
      <a mat-list-item
          [routerLink]="[route.path]"
          [activated]="isActive(route.path)"
          (click)="pageSelect.emit()">
        <mat-icon matListItemIcon>{{ route.icon }}</mat-icon>
        <span matListItemTitle>{{ route.label }}</span>
      </a>
    }
  }
</mat-nav-list>
