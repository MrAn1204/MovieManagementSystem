<app-dialog-container [title]="title()" [showCloseButton]="false" [actionAlign]="actionAlign()">
  <p dialog-content>
    {{ message() }}
  </p>

  @if (type() === 'success' || type() === 'danger') {
    <app-button-v2 variant="primary" (clicked)="closeDialog.emit()">Close</app-button-v2>
  } @else {
    <ng-container dialog-action>
      <app-button-v2 variant="secondary" (clicked)="closeDialog.emit()">Cancel</app-button-v2>

      <app-button-v2 variant="primary" (clicked)="confirm.emit()">Confirm</app-button-v2>
    </ng-container>
  }
</app-dialog-container>
