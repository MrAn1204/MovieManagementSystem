<h2 mat-dialog-title class="relative">
  <span class="pr-10">{{ title() }}</span>

  @if (showCloseButton()) {
    <app-button-icon (clicked)="closeDialog.emit()" class="absolute right-4 top-1/4">
      <mat-icon>close</mat-icon>
    </app-button-icon>
  }
</h2>

<mat-dialog-content>
  <ng-content select="[dialog-content]"></ng-content>
</mat-dialog-content>

<mat-dialog-actions [align]="actionAlign()" class="gap-4">
  <ng-content select="[dialog-action]"></ng-content>
</mat-dialog-actions>
