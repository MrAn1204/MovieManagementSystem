<app-menu>
  <button mat-menu-item (click)="view.emit()">
    <mat-icon>visibility</mat-icon>
    <span>View</span>
  </button>

  @if (canEdit()) {
    <button mat-menu-item (click)="edit.emit()">
      <mat-icon>edit</mat-icon>
      <span>Edit</span>
    </button>
  }

  @if (canDelete()) {
    <button mat-menu-item (click)="delete.emit()">
      <mat-icon>delete</mat-icon>
      <span>Delete</span>
    </button>
  }
</app-menu>
