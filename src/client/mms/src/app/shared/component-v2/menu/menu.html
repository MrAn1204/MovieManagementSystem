<mat-menu #menu="matMenu">
  @for (item of items(); track $index) {
    @if (item.children) {
      <button mat-menu-item [matMenuTriggerFor]="subMenu.menu()!">
        @if (item.icon) {
          <mat-icon>{{item.icon}}</mat-icon>
        }
        <span>{{item.label}}</span>
      </button>

      <app-menu #subMenu
        [items]="item.children"
        (action)="triggerAction($event)">
      </app-menu>
    } @else {
      <button mat-menu-item (click)="triggerAction(item.action)">
        @if (item.icon) {
          <mat-icon>{{item.icon}}</mat-icon>
        }
        <span>{{item.label}}</span>
      </button>
    }
  }
</mat-menu>
