<mat-form-field class="w-full" appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input matInput
    [id]="idName()"
    [type]="type()"
    [placeholder]="placeholder()"
    [formControl]="control()"
    [required]="required()">
  @if (control().touched && control().invalid) {
    <mat-error>{{ error }}</mat-error>
  }
</mat-form-field>
